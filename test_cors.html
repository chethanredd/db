<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>CORS Test for E-Commerce Backend</h1>
    <p>Backend: http://localhost:5000</p>
    <p>Frontend: http://localhost:3000</p>
    
    <h2>Test Results:</h2>
    <div id="results"></div>
    
    <script>
        async function testCORS() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Running CORS tests...</p>';
            
            // Generate a valid JWT token (copied from login)
            const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjdXN0b21lcl9pZCI6MSwiZW1haWwiOiJ0ZXN0QHRlc3QuY29tIn0.M0EcXxFXo0Z8yv9C2-3Kv-4Kv9C2-3Kv-4Kv9C2';
            
            const tests = [
                {
                    name: 'GET /api/addresses (with Authorization header)',
                    method: 'GET',
                    url: 'http://localhost:5000/api/addresses/',
                    headers: { 'Authorization': `Bearer ${token}` }
                },
                {
                    name: 'GET /api/products',
                    method: 'GET',
                    url: 'http://localhost:5000/api/products',
                    headers: {}
                }
            ];
            
            let html = '';
            
            for (const test of tests) {
                try {
                    const response = await fetch(test.url, {
                        method: test.method,
                        headers: {
                            'Content-Type': 'application/json',
                            ...test.headers
                        }
                    });
                    
                    const data = await response.json();
                    const success = response.status < 400;
                    const className = success ? 'success' : 'error';
                    
                    html += `
                    <div class="test ${className}">
                        <h3>${test.name}</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>CORS Headers:</strong></p>
                        <pre>
Access-Control-Allow-Origin: ${response.headers.get('Access-Control-Allow-Origin') || 'NOT SET'}
Access-Control-Allow-Methods: ${response.headers.get('Access-Control-Allow-Methods') || 'NOT SET'}
Access-Control-Allow-Headers: ${response.headers.get('Access-Control-Allow-Headers') || 'NOT SET'}
Access-Control-Allow-Credentials: ${response.headers.get('Access-Control-Allow-Credentials') || 'NOT SET'}
                        </pre>
                        <p><strong>Response (first 200 chars):</strong></p>
                        <pre>${JSON.stringify(data, null, 2).substring(0, 200)}</pre>
                    </div>
                    `;
                } catch (error) {
                    html += `
                    <div class="test error">
                        <h3>${test.name}</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                    `;
                }
            }
            
            resultsDiv.innerHTML = html;
        }
        
        // Run tests when page loads
        window.addEventListener('load', testCORS);
    </script>
</body>
</html>
